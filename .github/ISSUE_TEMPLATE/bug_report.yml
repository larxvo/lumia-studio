name: Bug report
description: Report a reproducible editing, import/export or installation problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not attach private images, documents, tokens or Canva secrets. Use a licensed, non-sensitive minimal fixture."
  - type: input
    id: version
    attributes:
      label: Luma version and platform
      placeholder: "9.0.1 / Windows 11 x64 or browser name/version"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence, file characteristics and relevant report
      description: "Image dimensions, format/bit depth, affected tool, redacted error or public fixture."
